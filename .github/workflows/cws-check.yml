# Chrome Web Store sign-in check (decisions.md, "CHROME UPLOADS AUTOMATED"; docs/store/GO-LIVE.md, "Chrome Web Store
# uploads").
#
# By hand only. It signs in exactly as release.yml's chrome-web-store job does (same environment, same Workload
# Identity Federation, same scope) and makes ONE read-only call, V2 fetchStatus. It uploads nothing and publishes
# nothing, so it proves the sign-in and the IDs before a release needs them.
#
# The `chrome-web-store` environment deploys from v* tags only, so dispatch it on a v* tag that CONTAINS this file
# (a workflow_dispatch run uses the workflow file at the ref it runs on): GO-LIVE.md, "The check-only run".

name: Chrome Web Store sign-in check

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Sign in and read the item's status (no upload)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: chrome-web-store
    permissions:
      id-token: write
    steps:
      # The two store IDs, checked before any call. A pasted secret can carry a line break (cws-check run 43372743291,
      # attempt 2: curl "(3) URL rejected"). Whitespace is removed, then each ID must match its format; a mismatch names
      # the secret, never its value. Later steps read the cleaned IDs from this step's outputs, never the raw secrets.
      - name: Check the store IDs (whitespace trimmed, format checked, values not printed)
        id: ids
        shell: bash
        env:
          RAW_PUBLISHER: ${{ secrets.CWS_PUBLISHER_ID }}
          RAW_ITEM: ${{ secrets.CWS_ITEM_ID }}
        run: |
          publisher="$(printf '%s' "$RAW_PUBLISHER" | tr -d '[:space:]')"
          item="$(printf '%s' "$RAW_ITEM" | tr -d '[:space:]')"
          ok=true
          # The item ID is the extension ID: 32 lowercase letters a-p.
          if ! [[ "$item" =~ ^[a-p]{32}$ ]]; then
            echo "::error::secret CWS_ITEM_ID is not a Chrome Web Store item ID (32 lowercase letters a-p): ${#item} characters after trimming; its value is not printed"
            ok=false
          fi
          # Google documents no publisher ID format; the API takes it as one URL path segment, so only URL-safe characters.
          if ! [[ "$publisher" =~ ^[A-Za-z0-9_-]{1,128}$ ]]; then
            echo "::error::secret CWS_PUBLISHER_ID is not a publisher ID (1 to 128 letters, digits, - or _): ${#publisher} characters after trimming; its value is not printed"
            ok=false
          fi
          if [ "$ok" != true ]; then
            exit 1
          fi
          echo "::add-mask::$publisher"
          echo "::add-mask::$item"
          if [ "$publisher" != "$RAW_PUBLISHER" ]; then
            echo "::warning::secret CWS_PUBLISHER_ID held whitespace or a line break; trimmed here, re-enter it to clean it"
          fi
          if [ "$item" != "$RAW_ITEM" ]; then
            echo "::warning::secret CWS_ITEM_ID held whitespace or a line break; trimmed here, re-enter it to clean it"
          fi
          echo "publisher=$publisher" >> "$GITHUB_OUTPUT"
          echo "item=$item" >> "$GITHUB_OUTPUT"
          echo "store IDs: well-formed"

      - name: Sign in to Google (Workload Identity Federation, no key)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 300s
          create_credentials_file: false

      - name: Read the item's status (V2 fetchStatus)
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PUBLISHER: ${{ steps.ids.outputs.publisher }}
          ITEM: ${{ steps.ids.outputs.item }}
        run: |
          out="$RUNNER_TEMP/status.json"
          code="$(curl -sS -o "$out" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER/items/$ITEM:fetchStatus")"
          echo "GET :fetchStatus -> HTTP $code"
          jq . "$out" 2>/dev/null || cat "$out"
          if [ "$code" != 200 ]; then
            echo "::error::fetchStatus returned HTTP $code"
            exit 1
          fi
          if [ "$(jq -r '.itemId // empty' "$out")" != "$ITEM" ]; then
            echo "::error::fetchStatus answered for a different item"
            exit 1
          fi
          published="$(jq -r '.publishedItemRevisionStatus.state // "unset"' "$out")"
          version="$(jq -r '[.publishedItemRevisionStatus.distributionChannels[]?.crxVersion] | first // "none"' "$out")"
          submitted="$(jq -r '.submittedItemRevisionStatus.state // "unset"' "$out")"
          {
            echo "### Chrome Web Store sign-in check"
            echo ''
            echo "Signed in and read the item: published \`$published\` (version \`$version\`), submitted revision \`$submitted\`. Nothing was uploaded."
          } >> "$GITHUB_STEP_SUMMARY"
