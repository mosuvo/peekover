name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Browser security tests
        run: pnpm test:browser
      - name: Build
        run: pnpm build

  # Reproducible builds (M13 task 7.3, D-14): clone this commit twice, build and zip both engines in each (one build
  # without SOURCE_DATE_EPOCH, one with it), and fail on any difference — every packaged file and every zip. The
  # hashes go to the run summary, to compare with a local build of the same commit (docs/trust/REPRODUCING.md).
  reproducible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build twice from clean clones and compare
        shell: bash
        run: pnpm exec tsx scripts/compare-builds.ts --twice 2>&1 | tee compare-builds.txt
      - name: Hashes to the run summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Build hashes ($(git rev-parse HEAD), Node $(node -v))"
            echo ''
            echo '```'
            grep -E '^[0-9a-f]{64}  ' compare-builds.txt || echo 'no hashes (the build failed)'
            grep -E '^(REPRODUCIBLE|NOT REPRODUCIBLE)' compare-builds.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
