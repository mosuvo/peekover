name: AI workflow hygiene
on:
  pull_request:
jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check memory freshness
        run: STRICT=0 ./scripts/check-freshness.sh 5
        # Set STRICT=1 to make stale memory fail the PR once the habit sticks.
