# Release (M13 task 7.4, D-14; plan G-9).
#
# Runs ONLY on a version tag (`v*`) or by hand. It builds both engines from the tagged commit, proves the build
# reproducible (two clean clones, compared), runs lint and the unit tests, and makes the release files: the Chrome
# zip, the Firefox zip, the Firefox sources zip, the SBOM, THIRD_PARTY_LICENSES.txt and SHA256SUMS. It then attests
# them (public repository only) and creates a DRAFT release. It never publishes a release: that is the human's
# (docs/store/GO-LIVE.md).
#
# On a real tag release (not a dry run), the chrome-web-store job uploads the release's Chrome zip to the Chrome Web
# Store and submits it for review (decisions.md, "CHROME UPLOADS AUTOMATED"; GO-LIVE.md, "Chrome Web Store uploads").
# It runs in the `chrome-web-store` environment, which waits for the human's approval, and signs in to Google with
# Workload Identity Federation: no key file, no long-lived credential. It uses the Chrome Web Store API V2 only. No
# other store is uploaded to: AMO and Edge stay by hand.
#
# By hand (workflow_dispatch), `dry_run` defaults to true: everything runs except creating the release. A release is
# created by hand only from a tag ref with `dry_run` unchecked.
#
# Attestations: on GitHub Free, Pro and Team they exist for public repositories only, so the attest job runs only when
# the repository is public and shows as skipped otherwise (decisions.md, "M13 GATE 3 APPROVED", G-9).
#
# The three setup actions are pinned to the exact commits ci.yml's reproducible job ran with when CI verified the
# build (run 42164163720), so the release build is that build. No dependency cache: a release build installs from
# the lockfile alone. Every action is pinned by full commit SHA. The secrets are GITHUB_TOKEN and, in the
# chrome-web-store job only, the four environment secrets of `chrome-web-store` (no key among them).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build, test and attest, but create no release'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Check the tag equals package.json's version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match package.json version $version (expected v$version)"
              exit 1
            fi
            echo "tag $REF_NAME = v$version"
          else
            echo "not a tag ($REF_TYPE $REF_NAME): version $version, tag check skipped (dry run)"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # First, on the fresh checkout: the sources zip takes every non-dot file in the folder, so nothing may be
      # written there before it (REPRODUCING.md, "Build in a fresh clone"). Scratch output goes to RUNNER_TEMP.
      - name: Build the release zips
        run: |
          pnpm zip
          pnpm zip -b firefox

      # The SBOM is read from the builds above; SOURCE_DATE_EPOCH = the tagged commit's time, so it is reproducible.
      - name: Generate the SBOM
        shell: bash
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" pnpm exec tsx scripts/generate-sbom.ts --no-build

      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test

      # The 7.3 check (ci.yml job reproducible): two clean clones of this commit, built and compared.
      - name: Build twice from clean clones and compare
        shell: bash
        run: pnpm exec tsx scripts/compare-builds.ts --twice 2>&1 | tee "$RUNNER_TEMP/compare-builds.txt"

      - name: Collect the release files and SHA256SUMS
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir dist
          cp ".output/peekover-$version-chrome.zip" ".output/peekover-$version-firefox.zip" \
             ".output/peekover-$version-sources.zip" sbom.cdx.json public/THIRD_PARTY_LICENSES.txt dist/
          # Each zip must be the one the clean-clone comparison built.
          for zip in chrome firefox sources; do
            name="peekover-$version-$zip.zip"
            want="$(grep -E "^[0-9a-f]{64}  $name\$" "$RUNNER_TEMP/compare-builds.txt" | cut -d' ' -f1)"
            got="$(sha256sum "dist/$name" | cut -d' ' -f1)"
            if [ -z "$want" ] || [ "$want" != "$got" ]; then
              echo "::error::$name differs from the clean-clone build ($got, expected ${want:-nothing})"
              exit 1
            fi
          done
          (cd dist && sha256sum -- *.zip sbom.cdx.json THIRD_PARTY_LICENSES.txt > SHA256SUMS)

      - name: Release files to the run summary
        shell: bash
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          {
            echo "### Release files ($(git rev-parse HEAD), Node $(node -v))"
            echo ''
            echo '```'
            cat dist/SHA256SUMS
            grep -E '^(REPRODUCIBLE|NOT REPRODUCIBLE)' "$RUNNER_TEMP/compare-builds.txt" || true
            echo '```'
            if [ "$PRIVATE" = true ]; then
              echo 'Attestation: skipped — the repository is private (attestations need a public repository on this plan).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest the release files (public repository only)
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

  release:
    name: Create the draft release
    needs: [build, attest]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && (needs.attest.result == 'success' || needs.attest.result == 'skipped')
      && github.ref_type == 'tag'
      && (github.event_name == 'push' || !inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Create a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --draft --verify-tag --title "Peekover ${TAG#v}" \
            --notes "What changed: CHANGELOG.md. To check a download, compare it with SHA256SUMS; to rebuild it, see docs/trust/REPRODUCING.md."

  # The Chrome Web Store (decisions.md, "CHROME UPLOADS AUTOMATED"; docs/store/GO-LIVE.md, "Chrome Web Store
  # uploads"). After the draft release exists, on a real tag release only. The environment holds the four secrets,
  # allows only v* tags and waits for the human's approval; Google admits only this repository's tokens for this
  # environment (the provider's attribute condition). The zip is the release-files artifact the draft release was
  # created from, checked against its SHA256SUMS before it is sent. API V2 only
  # (https://developer.chrome.com/docs/webstore/using-api); a non-2xx response or an unexpected state fails the job,
  # and each response body is printed (it holds no token).
  chrome-web-store:
    name: Upload to the Chrome Web Store and submit for review
    needs: [build, attest, release]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && needs.attest.result == 'success'
      && needs.release.result == 'success'
      && github.ref_type == 'tag'
      && (github.event_name == 'push' || !inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Check the Chrome zip against SHA256SUMS
        id: zip
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          name="peekover-$version-chrome.zip"
          lines="$(awk -v n="$name" '$2 == n || $2 == "*" n' dist/SHA256SUMS)"
          if [ "$(printf '%s' "$lines" | grep -c .)" != 1 ]; then
            echo "::error::SHA256SUMS has no single line for $name"
            exit 1
          fi
          (cd dist && printf '%s\n' "$lines" | sha256sum --check --strict -)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=dist/$name" >> "$GITHUB_OUTPUT"

      - name: Sign in to Google (Workload Identity Federation, no key)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 900s
          create_credentials_file: false

      - name: Upload the zip (V2 upload)
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PUBLISHER: ${{ secrets.CWS_PUBLISHER_ID }}
          ITEM: ${{ secrets.CWS_ITEM_ID }}
          ZIP: ${{ steps.zip.outputs.zip }}
          VERSION: ${{ steps.zip.outputs.version }}
        run: |
          api=https://chromewebstore.googleapis.com
          item="publishers/$PUBLISHER/items/$ITEM"
          call() { # METHOD URL OUT [curl args]: prints the status and body; fails on a non-2xx status
            local method=$1 url=$2 out=$3 code
            shift 3
            code="$(curl -sS -o "$out" -w '%{http_code}' -X "$method" -H "Authorization: Bearer $TOKEN" "$@" "$url")"
            echo "$method :${url##*:} -> HTTP $code"
            jq . "$out" 2>/dev/null || cat "$out"
            if [ "${code:0:1}" != 2 ]; then
              echo "::error::${url##*:} returned HTTP $code"
              return 1
            fi
          }
          call POST "$api/upload/v2/$item:upload" "$RUNNER_TEMP/upload.json" \
            -H 'Content-Type: application/zip' --data-binary "@$ZIP"
          state="$(jq -r '.uploadState // empty' "$RUNNER_TEMP/upload.json")"
          crx="$(jq -r '.crxVersion // empty' "$RUNNER_TEMP/upload.json")"
          # An upload may finish asynchronously: poll fetchStatus until it leaves IN_PROGRESS (about 5 minutes at most).
          for i in $(seq 1 30); do
            [ "$state" = IN_PROGRESS ] || break
            sleep 10
            call GET "$api/v2/$item:fetchStatus" "$RUNNER_TEMP/status.json"
            state="$(jq -r '.lastAsyncUploadState // empty' "$RUNNER_TEMP/status.json")"
            echo "poll $i: lastAsyncUploadState ${state:-unset}"
          done
          echo "uploadState: ${state:-unset}, crxVersion: ${crx:-not given}"
          if [ "$state" != SUCCEEDED ]; then
            echo "::error::the upload did not succeed (state ${state:-unset})"
            exit 1
          fi
          if [ -n "$crx" ] && [ "$crx" != "$VERSION" ]; then
            echo "::error::the store read version $crx from the zip, expected $VERSION"
            exit 1
          fi

      - name: Submit for review (V2 publish, goes live once approved)
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PUBLISHER: ${{ secrets.CWS_PUBLISHER_ID }}
          ITEM: ${{ secrets.CWS_ITEM_ID }}
          VERSION: ${{ steps.zip.outputs.version }}
        run: |
          api=https://chromewebstore.googleapis.com
          item="publishers/$PUBLISHER/items/$ITEM"
          call() { # METHOD URL OUT [curl args]: prints the status and body; fails on a non-2xx status
            local method=$1 url=$2 out=$3 code
            shift 3
            code="$(curl -sS -o "$out" -w '%{http_code}' -X "$method" -H "Authorization: Bearer $TOKEN" "$@" "$url")"
            echo "$method :${url##*:} -> HTTP $code"
            jq . "$out" 2>/dev/null || cat "$out"
            if [ "${code:0:1}" != 2 ]; then
              echo "::error::${url##*:} returned HTTP $code"
              return 1
            fi
          }
          call POST "$api/v2/$item:publish" "$RUNNER_TEMP/publish.json" \
            -H 'Content-Type: application/json' --data '{"publishType":"DEFAULT_PUBLISH"}'
          state="$(jq -r '.state // empty' "$RUNNER_TEMP/publish.json")"
          echo "publish state: ${state:-unset}"
          case "$state" in
            PENDING_REVIEW | PUBLISHED) ;;
            *)
              echo "::error::publish returned state ${state:-unset}, not PENDING_REVIEW or PUBLISHED: see the dashboard"
              exit 1
              ;;
          esac
          call GET "$api/v2/$item:fetchStatus" "$RUNNER_TEMP/status.json"
          submitted="$(jq -r '.submittedItemRevisionStatus.state // "unset"' "$RUNNER_TEMP/status.json")"
          crx="$(jq -r '[(.submittedItemRevisionStatus // .publishedItemRevisionStatus).distributionChannels[]?.crxVersion] | first // empty' "$RUNNER_TEMP/status.json")"
          if [ "$crx" != "$VERSION" ]; then
            echo "::warning::fetchStatus shows version ${crx:-none}, expected $VERSION: check the dashboard"
          fi
          {
            echo "### Chrome Web Store"
            echo ''
            echo "Uploaded peekover-$VERSION-chrome.zip (checked against SHA256SUMS) and submitted it: publish state \`$state\`, submitted revision \`$submitted\`, version \`${crx:-none}\`."
          } >> "$GITHUB_STEP_SUMMARY"
